<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Survey Form</title>
  </head>

  <body>
    <header>
        <h1 id="title">SURVEY FORM</h1>
        <p id="description">tell us about your experience</p>
    </header>
    <main>
        <form id="survey-form" method="POST" action="">
          <fieldset>

            <label for="name" id="name-label">Name: </label>
            <input type="text" id="name" required placeholder="e.g., joe"/>

            <label for="email"id="email-label">Email Address:</label>
            <input type="email"id="email" required placeholder="xyz@email.com">

            <label for="number" id="number-label">Age:</label>
            <input type="number" id="number" min="3" max="100" required placeholder="18">
          </fieldset>

          <fieldset>

            <label for="dropdown">Experience:</label>

            <select id="dropdown" name="experience">

            <option selected>excellent</option>
            <option>average</option>
            <option>good</option>
           </select>

          </fieldset>

          <fieldset>
            <label> Your Gender:</label>

            <label for="male">Male</label>
            <input type="radio" name="gender" id="male" value="male">

            <label for="female">Female</label>
            <input type="radio" name="gender" id="female" value="female">
          </fieldset>

          <fieldset>
            <label>what did you like about us?</label>

            <input type="checkbox" id="location" value="location">
            <label for="location">Location</label>

            <input type="checkbox" id="service" value="service">
            <label for="service">Service</label>
      
          </fieldset>
          <fieldset>
            <p>Give Us Feedback:</p>
            <textarea required placeholder="tell us how we can improve"></textarea>
          </fieldset>

          <button id="submit" type="submit">Submit</button>
        </form>

        
    </main>
  </body>
</html>
