<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Playing Cards</title>
  <link rel="stylesheet" href="styles.css">
</head>

<body>
  <main id="playing-cards">
    <div class="card">
      <div class="left">♠ 1</div>
      <div class="middle">♠</div>
      <div class="right">1 ♠</div>
    </div>
    <div class="card">
      <div class="left">♣ 1</div>
      <div class="middle">♣</div>
      <div class="right">1 ♣</div>
    </div>
    <div class="card">
      <div class="left he">♥ 1</div>
      <div class="middle he">♥</div>
      <div class="right he">1 ♥</div>
    </div>
    <div class="card">
      <div class="left di">♦ 1</div>
      <div class="middle di">♦</div>
      <div class="right di">1 ♦</div>
    </div>

  </main>
</body>

</html>
