<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Application Form</title>
    <link rel="stylessheet" href="styles.css"
</head>
<body>
    <div class="container">
        <h1>Job Application Form</h1>
        <form>
            <label for="name">Full-Name:</label>
            <input type="text" id="name" placeholder="e.g ,Joe" name="name" required>

            <label for="email">Email:</label>
            <input type="email" id="email" placeholder="xyz@email.com" name="email" required>

            <label for="position">Position:</label>
            <select 
            id="position" name="position">
                <option default>Select a position</option>
                <option value="designer">Designer</option>
                <option value="developer">Developer</option>
                <option value="manager">Manager</option>
            </select>
            <fieldset class="radio-group">
                <legend>Availability</legend>
                <input
                    type="radio"
                    name="availability"
                    id="sem"
                    value="sem"
                    class="no"
                    checked
                >
                <label for="sem" class="ok">full-time</label>
                <input
                    type="radio"
                    name="availability"
                    id="year"
                    value="year"
                    class="no"
                >
                <label for="year" class="ok">part-time</label>
            </fieldset>            
            <label for="message">Why do you want his job?</label>
            <textarea id="message" rows="4" cols="50"></textarea>
            <button type="submit">Submit Form</button>
        </form>

    </div>

</body>
</html>
